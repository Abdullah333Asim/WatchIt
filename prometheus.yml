global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          machine: 'Host-Machine'

  - job_name: 'watchit-backend'
    static_configs:
      # 'host.docker.internal' allows the Docker container to see your local computer's port 3000
      - targets: ['host.docker.internal:3000']